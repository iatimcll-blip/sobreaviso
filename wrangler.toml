name = "painel-sobreaviso"
main = "server/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
# Somente para desenvolvimento local. Em produção este valor é injetado pela plataforma de hospedagem.
SESSION_SECRET = "dev-only-secret-nao-usar-em-producao"

[[d1_databases]]
binding = "DB"
database_name = "sobreaviso-db"
database_id = "local-dev"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sobreaviso-arquivos"

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "single-page-application"
